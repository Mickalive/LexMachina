[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-counter-evidence-content-filter"
version = "0.1.0"
description = "Deterministic content-quality filter for counter-evidence spans"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["frontier_counter_evidence_content_filter*"]
