<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexMachina — Query Map MVP</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  #left { width: 380px; min-width: 320px; overflow-y: auto; padding: 12px; border-right: 1px solid #ccc; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #bar { padding: 8px; border-bottom: 1px solid #ccc; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #map { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  #detail { position: absolute; right: 8px; top: 8px; width: 320px; max-height: 90%; overflow-y: auto;
            background: rgba(255,255,255,.96); border: 1px solid #999; padding: 10px; display: none; }
  .stmt { margin: 6px 0; padding: 6px; background: #f4f6ff; border-left: 3px solid #36c; font-size: 13px; }
  .counter { margin: 6px 0; padding: 6px; background: #fff4f4; border-left: 3px solid #c33; font-size: 13px; }
  .legend span { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: middle; }
  input[type=text] { flex: 1; min-width: 200px; padding: 6px; }
  button { padding: 6px 12px; }
  #status { font-size: 12px; color: #555; }
  h3 { margin: 12px 0 4px; font-size: 14px; }
  a { color: #36c; }
</style>
</head>
<body>
<div id="left">
  <h2>LexMachina Query Map</h2>
  <div id="answer"><h3>Antwort (quellenbasiert)</h3><div id="prose">Anfrage stellen …</div></div>
  <div id="counters"><h3>Gegen-/Ausnahme-Entscheide</h3><div id="counterList">–</div></div>
  <div id="clusters"><h3>Cluster</h3><div id="clusterList" class="legend">–</div></div>
</div>
<div id="main">
  <div id="bar">
    <input id="q" type="text" value="Kündigung Mietvertrag Mietrecht" placeholder="Rechtsfrage …">
    <select id="n"><option>60</option><option selected>120</option><option>200</option></select>
    <button id="run">Suchen + Karte</button>
    <span id="status"></span>
  </div>
  <div id="map"><canvas id="cv"></canvas><div id="detail"></div></div>
</div>
<script>
const COLORS = ["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd","#8c564b","#e377c2","#7f7f7f"];
let BUNDLE = null, PTS = [];
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");

function fit() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = Math.max(300, r.width); cv.height = Math.max(300, r.height - 2);
  draw();
}
window.addEventListener("resize", fit);

async function run() {
  const q = document.getElementById("q").value.trim();
  const n = document.getElementById("n").value;
  if (!q) return;
  document.getElementById("status").textContent = "lädt …";
  const res = await fetch("/api/query/run?q=" + encodeURIComponent(q) + "&n=" + n);
  const b = await res.json();
  if (b.error) { document.getElementById("status").textContent = "Fehler: " + b.error; return; }
  BUNDLE = b;
  document.getElementById("status").textContent =
    b.decisions.length + " Entscheide, " + b.clusters.length + " Cluster, " +
    b.provenance.latency_seconds + "s (" + b.provenance.corpus.live_provenance + ")";
  renderAnswer(b); renderCounters(b); renderClusters(b); layout(b); draw();
}
document.getElementById("run").onclick = run;

function renderAnswer(b) {
  const el = document.getElementById("prose");
  el.innerHTML = "<p style='font-size:13px'>" + esc(b.answer.prose).slice(0, 600) + "…</p>" +
    b.answer.statements.map((s, i) =>
      `<div class="stmt">[${i+1}] <a href="#" data-did="${esc(s.decision_id)}">${esc(s.decision_id)}</a><br>${esc(s.text)}</div>`).join("");
  el.querySelectorAll("a[data-did]").forEach(a => a.onclick = e => { e.preventDefault(); showDetail(a.dataset.did); });
}

function renderCounters(b) {
  const cs = b.decisions.filter(d => d.counter_status && d.counter_status !== "none" && d.counter_status !== "cited");
  document.getElementById("counterList").innerHTML = cs.length ?
    cs.map(d => `<div class="counter"><a href="#" data-did="${esc(d.decision_id)}">${esc(d.decision_id)}</a> ` +
      `<i>${esc(d.counter_status)}</i><br>${esc(d.counter_evidence || d.snippet).slice(0, 220)}</div>`).join("") :
    "Keine Gegen-Kandidaten im Abruf gefunden.";
  document.querySelectorAll("#counterList a[data-did]").forEach(a => a.onclick = e => { e.preventDefault(); showDetail(a.dataset.did); });
}

function renderClusters(b) {
  document.getElementById("clusterList").innerHTML = b.clusters.map(c =>
    `<div><span style="background:${COLORS[c.cluster_id % 8]}"></span><b>C${c.cluster_id}</b> (${c.size}): ${esc(c.label)}</div>`).join("");
}

function layout(b) {
  PTS = b.decisions.map(d => ({ ...d }));
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!PTS.length) return;
  const pad = 40, W = cv.width - 2 * pad, H = cv.height - 2 * pad;
  for (const p of PTS) {
    const px = pad + (p.x + 1) / 2 * W, py = pad + (1 - (p.y + 1) / 2) * H;
    p._px = px; p._py = py;
    const isCounter = p.counter_status && p.counter_status !== "none" && p.counter_status !== "cited";
    const isCited = p.counter_status === "cited";
    ctx.beginPath();
    ctx.arc(px, py, isCited ? 7 : 5, 0, 7);
    ctx.fillStyle = COLORS[p.cluster_id % 8];
    ctx.globalAlpha = p.is_outlier ? 0.55 : 0.9;
    ctx.fill(); ctx.globalAlpha = 1;
    if (isCounter) { ctx.lineWidth = 2.5; ctx.strokeStyle = "#c00"; ctx.stroke(); }
    if (isCited) { ctx.lineWidth = 2; ctx.strokeStyle = "#fa0"; ctx.stroke(); }
    if (p.is_outlier) { ctx.lineWidth = 1; ctx.strokeStyle = "#333"; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]); }
  }
  ctx.fillStyle = "#333"; ctx.font = "12px sans-serif";
  ctx.fillText("● Cluster-Farbe  ○-rot = Gegen-Kandidat  ○-gold = zitiert  ┄ = Outlier", 10, 16);
}

cv.onclick = e => {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const p of PTS) {
    const d = (p._px - mx) ** 2 + (p._py - my) ** 2;
    if (d < bd) { bd = d; best = p; }
  }
  if (best && bd < 30 * 30) showDetail(best.decision_id);
};

function showDetail(did) {
  const d = BUNDLE.decisions.find(x => x.decision_id === did);
  if (!d) return;
  const cl = BUNDLE.clusters.find(c => c.cluster_id === d.cluster_id);
  const rels = BUNDLE.relations.filter(r => r.source === did || r.target === did).slice(0, 8);
  document.getElementById("detail").style.display = "block";
  document.getElementById("detail").innerHTML =
    `<b>${esc(d.decision_id)}</b> <button style="float:right" onclick="document.getElementById('detail').style.display='none'">×</button><br>` +
    `${esc(d.court)} · ${esc(d.language)} · ${esc(d.decision_date)} · ${esc(d.docket_number)}<br>` +
    `Rank ${d.rank} · Score ${d.score} · Cluster C${d.cluster_id} (${esc(cl ? cl.label : "")})<br>` +
    `Status: <b>${esc(d.counter_status)}</b>${d.is_outlier ? " · Outlier" : ""}<br><br>` +
    `${esc(d.snippet)}…<br><br>` +
    (d.counter_evidence ? `<i>Gegen-Hinweis:</i> ${esc(d.counter_evidence)}<br><br>` : "") +
    (rels.length ? `<i>Relationen:</i><br>` + rels.map(r => `↔ ${esc(r.source === did ? r.target : r.source)} (${esc((r.shared||[]).join(", "))})`).join("<br>") + "<br><br>" : "") +
    `<a href="${esc(d.canonical_url)}" target="_blank">Quelle öffnen ↗</a>`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
fit();
run();
</script>
</body>
</html>
