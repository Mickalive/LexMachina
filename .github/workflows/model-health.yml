name: LEX Free Model Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-health.yml'
      - '.opencode/agents/model_probe.md'
      - 'docs/agents/AGENT_CARDS.md'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lex-free-model-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install current OpenCode
        shell: bash
        run: curl --retry 5 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Discover and tool-probe free models
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.lex_model_health"
          MODELS_LOG=$GITHUB_WORKSPACE/.lex_model_health/models.txt
          if ! opencode models > "$MODELS_LOG" 2>&1; then
            echo "::warning::opencode models failed"
            cat "$MODELS_LOG" || true
          fi

          # Preferred order first, then dynamically discovered OpenCode free models.
          PREFERRED_ORDER=(
            'opencode/x-preview-f-free'
            'opencode/nemotron-3-ultra-free'
            'opencode/mimo-v2.6-flash-free'
            'opencode/mimo-v2.5-free'
            'opencode/nemotron-3.5-lightning-free'
            'opencode/ling-3.1-flash-free'
            'opencode/ling-3.0-flash-fin-free'
            'opencode/space-bunny-free'
            'opencode/longcat-2.5-preview-free'
            'opencode/step-5-preview-free'
            'opencode/exo-free'
            'opencode/muse-spark-1.3-contributor-free'
            'opencode/jev-1.13-free'
            'opencode/big-pickle'
          )

          mapfile -t DISCOVERED < <(grep -Eo 'opencode/[A-Za-z0-9._-]+' "$MODELS_LOG" | grep -E '(-free$|/big-pickle$)' | sort -u || true)
          CANDIDATES=()
          declare -A SEEN=()
          for model in "${PREFERRED_ORDER[@]}" "${DISCOVERED[@]}"; do
            [[ -n "$model" ]] || continue
            [[ -z "${SEEN[$model]:-}" ]] || continue
            SEEN[$model]=1
            CANDIDATES+=("$model")
          done

          RESULTS=$GITHUB_WORKSPACE/.lex_model_health/results.jsonl
          HEALTHY_FILE=$GITHUB_WORKSPACE/.lex_model_health/healthy.txt
          : > "$RESULTS"
          : > "$HEALTHY_FILE"
          PREFERRED='opencode/x-preview-f-free'
          MAX_HEALTHY=4

          for model in "${CANDIDATES[@]}"; do
            if ! grep -Fq "$model" "$MODELS_LOG"; then
              jq -nc --arg m "$model" '{model:$m,catalog_present:false,tool_probe:"SKIPPED_ABSENT"}' >> "$RESULTS"
              continue
            fi

            MARKER="$GITHUB_WORKSPACE/.lex_model_health/marker_${GITHUB_RUN_ID}_$(echo "$model" | tr '/.-' '___')"
            rm -f "$MARKER"
            LOG="$GITHUB_WORKSPACE/.lex_model_health/probe_$(echo "$model" | tr '/.-' '___').log"

            echo "Probing $model with a real bash-tool side effect"
            set +e
            timeout 90 opencode run --model "$model" --agent model_probe \
              "Use the bash tool exactly once to run: printf 'LEX_MODEL_TOOL_OK' > '$MARKER'. Do not merely print the token. After the file exists, stop." \
              >"$LOG" 2>&1
            rc=$?
            set -e

            if [[ "$rc" -eq 0 && -f "$MARKER" && "$(cat "$MARKER" 2>/dev/null)" == 'LEX_MODEL_TOOL_OK' ]]; then
              jq -nc --arg m "$model" --argjson rc "$rc" '{model:$m,catalog_present:true,tool_probe:"PASS",exit_code:$rc}' >> "$RESULTS"
              echo "$model" >> "$HEALTHY_FILE"
              if [[ "$(wc -l < "$HEALTHY_FILE")" -ge "$MAX_HEALTHY" ]]; then
                break
              fi
            else
              diag=$(tail -n 20 "$LOG" 2>/dev/null | tr '\n' ' ' | cut -c1-1500)
              jq -nc --arg m "$model" --argjson rc "$rc" --arg d "$diag" '{model:$m,catalog_present:true,tool_probe:"FAIL",exit_code:$rc,diagnostic:$d}' >> "$RESULTS"
            fi
          done

          mapfile -t HEALTHY < "$HEALTHY_FILE"
          RESOLVED="${HEALTHY[0]:-}"
          HEALTHY_JSON=$(printf '%s\n' "${HEALTHY[@]}" | sed '/^$/d' | jq -R . | jq -s .)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -s --arg preferred "$PREFERRED" --arg resolved "$RESOLVED" --arg now "$NOW" --arg run "$GITHUB_RUN_ID" --argjson healthy_models "$HEALTHY_JSON" '
            {
              policy_version:2,
              preferred_model:$preferred,
              resolved_model:(if $resolved=="" then null else $resolved end),
              healthy_models:$healthy_models,
              healthy_model_count:($healthy_models|length),
              healthy:($resolved!=""),
              using_fallback:($resolved!="" and $resolved!=$preferred),
              free_only:true,
              last_checked_at:$now,
              last_checked_run_id:$run,
              status:(if $resolved=="" then "NO_TOOL_CAPABLE_FREE_MODEL" elif ($healthy_models|length)>1 then "FREE_MODEL_POOL_ACTIVE" elif $resolved==$preferred then "OX_HEALTHY" else "FREE_FALLBACK_ACTIVE" end),
              probe_results:.
            }' "$RESULTS" > /tmp/model_health.json

          cat /tmp/model_health.json
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Publish model-health state to main
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/model_health.json state/model_health.json
          git config user.name "lex-model-health"
          git config user.email "lex-model-health@autonomous.local"
          git add state/model_health.json
          git diff --cached --quiet && { echo 'No model-health delta'; exit 0; }
          git commit -m "control: refresh free model health ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            cp /tmp/model_health.json state/model_health.json
            git add state/model_health.json
            git commit -m "control: refresh free model health ${GITHUB_RUN_ID}" || true
            sleep $((i*3))
          done
          exit 1

  resilience:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake supervisor regardless of probe outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          set -euo pipefail
          echo "Model-health finalizer: probe=$PROBE_RESULT"
          gh workflow run factory-supervisor.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Supervisor explicitly awakened by model-health finalizer."
