name: LEX Factory Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "LEX Core Lane"
      - "LEX Frontier Team"
      - "LEX Factory Director"
      - "LEX Free Model Health"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'state/factory_direction.json'
      - 'state/frontier_portfolio.json'
      - 'state/model_health.json'
      - 'state/blockers/**'
      - '.github/workflows/factory-supervisor.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: lex-factory-supervisor
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Fill useful factory capacity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Never create a storm of known-dead agent runs. Model Health performs
          # an actual tool side-effect probe and writes this state. As soon as a
          # free candidate passes, its state push wakes this Supervisor instantly.
          if [[ "$(jq -r '.healthy // false' state/model_health.json 2>/dev/null || echo false)" != true ]]; then
            echo "Factory agent dispatch paused: no tool-capable free OpenCode model has passed health probe."
            exit 0
          fi
          echo "Factory model: $(jq -r '.resolved_model' state/model_health.json) (fallback=$(jq -r '.using_fallback' state/model_health.json))"

          commit_blockers() {
            if ! git diff --quiet -- state/blockers 2>/dev/null || [[ -n "$(git ls-files --others --exclude-standard state/blockers 2>/dev/null)" ]]; then
              git config user.name "lex-factory-supervisor"; git config user.email "lex-supervisor@autonomous.local"
              git add state/blockers
              git commit -m "supervisor: persist repeated operational blocker" || return 0
              for i in 1 2 3 4 5; do if git pull --rebase origin main && git push origin HEAD:main; then break; fi; git rebase --abort 2>/dev/null || true; sleep $((i*2)); done
            fi
          }

          core_active() {
            local lane="$1" v="$2" prefix="Core ${lane} dirV${v} "
            gh run list --repo "$GITHUB_REPOSITORY" --workflow core-lane.yml --limit 100 --json displayTitle,status \
              | jq --arg p "$prefix" '[.[] | select(.displayTitle|startswith($p)) | select(.status=="queued" or .status=="in_progress" or .status=="requested" or .status=="waiting" or .status=="pending")] | length'
          }

          repeated_core_failure() {
            local lane="$1" v="$2" prefix="Core ${lane} dirV${v} "
            gh run list --repo "$GITHUB_REPOSITORY" --workflow core-lane.yml --limit 100 --json displayTitle,status,conclusion,createdAt \
              | jq --arg p "$prefix" '[.[] | select(.displayTitle|startswith($p)) | select(.status=="completed")][0:3] as $r | (($r|length)>=3 and all($r[]; (.conclusion!="success")))'
          }

          for lane in corpus legal-distance fractal-map evaluation product; do
            status=$(jq -r --arg lane "$lane" '.lanes[$lane].status // "PAUSE"' state/factory_direction.json)
            [[ "$status" == RUN ]] || { echo "$lane: $status"; continue; }
            v=$(jq -r '.version' state/factory_direction.json)
            q=$(jq -r --arg lane "$lane" '.lanes[$lane].question // ""' state/factory_direction.json)
            qhash=$(printf '%s' "$q" | sha256sum | awk '{print $1}')

            if [[ -f "state/blockers/$lane.json" ]] && [[ "$(jq -r '.question_hash // ""' "state/blockers/$lane.json")" == "$qhash" ]]; then
              echo "$lane: blocked for current question; Director must change the question or status."
              continue
            fi

            if [[ "$lane" != product ]] && git ls-remote --exit-code --heads origin "refs/heads/lab/$lane" >/dev/null 2>&1; then
              raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/${lane}.json?ref=lab/${lane}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
              if [[ -n "$raw" ]] && [[ "$(jq -r '.continue_recommended // true' <<<"$raw")" == false ]] && [[ "$(jq -r '.direction_version // -1' <<<"$raw")" == "$v" ]]; then
                echo "$lane: accepted state says no further identical cycle under direction v$v."
                continue
              fi
            fi

            active=$(core_active "$lane" "$v")
            [[ "$active" -eq 0 ]] || { echo "$lane: already active/queued"; continue; }

            if [[ "$(repeated_core_failure "$lane" "$v")" == true ]]; then
              mkdir -p state/blockers
              jq -n --arg lane "$lane" --argjson v "$v" --arg hash "$qhash" '{lane:$lane,direction_version:$v,question_hash:$hash,reason:"THREE_CONSECUTIVE_OPERATIONAL_FAILURES"}' > "state/blockers/$lane.json"
              echo "::warning::$lane blocked after three consecutive operational failures under same direction."
              continue
            fi

            gh workflow run core-lane.yml --repo "$GITHUB_REPOSITORY" --ref main -f lane="$lane" -f direction_version="$v" -f repair_round=0
            echo "$lane: dispatched direction v$v"
          done

          jq -c '.teams[] | select(.status=="RUN")' state/frontier_portfolio.json | while IFS= read -r item; do
            team=$(jq -r .team_id <<<"$item"); ver=$(jq -r .charter_version <<<"$item")
            [[ "$team" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || continue
            if [[ -f "state/blockers/frontier/$team.json" ]] && [[ "$(jq -r '.charter_version // -1' "state/blockers/frontier/$team.json")" == "$ver" ]]; then echo "Frontier $team v$ver blocked"; continue; fi

            if git ls-remote --exit-code --heads origin "refs/heads/lab/frontier/$team" >/dev/null 2>&1; then
              raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/frontier/${team}.json?ref=lab/frontier/${team}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
              if [[ -n "$raw" ]] && [[ "$(jq -r '.charter_version // -1' <<<"$raw")" == "$ver" ]] && [[ "$(jq -r '.continue_recommended // true' <<<"$raw")" == false ]]; then echo "Frontier $team v$ver completed its same-charter work; awaiting Director."; continue; fi
            fi

            prefix="Frontier ${team} v${ver} "
            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow frontier-team.yml --limit 100 --json displayTitle,status | jq --arg p "$prefix" '[.[] | select(.displayTitle|startswith($p)) | select(.status=="queued" or .status=="in_progress" or .status=="requested" or .status=="waiting" or .status=="pending")] | length')
            [[ "$active" -eq 0 ]] || { echo "Frontier $team already active"; continue; }
            failed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow frontier-team.yml --limit 100 --json displayTitle,status,conclusion | jq --arg p "$prefix" '[.[] | select(.displayTitle|startswith($p)) | select(.status=="completed")][0:3] as $r | (($r|length)>=3 and all($r[]; (.conclusion!="success")))')
            if [[ "$failed" == true ]]; then mkdir -p state/blockers/frontier; jq -n --arg team "$team" --argjson ver "$ver" '{team_id:$team,charter_version:$ver,reason:"THREE_CONSECUTIVE_OPERATIONAL_FAILURES"}' > "state/blockers/frontier/$team.json"; echo "::warning::Frontier $team blocked after repeated operational failure"; continue; fi
            gh workflow run frontier-team.yml --repo "$GITHUB_REPOSITORY" --ref main -f team_id="$team" -f charter_version="$ver" -f repair_round=0
            echo "Frontier $team v$ver dispatched"
          done

          commit_blockers
