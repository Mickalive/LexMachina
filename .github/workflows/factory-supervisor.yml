name: LEX Factory Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "LEX Core Lane"
      - "LEX Frontier Team"
      - "LEX Factory Director"
      - "LEX Free Model Health"
      - "LEX Factory Housekeeper"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'state/factory_direction.json'
      - 'state/frontier_portfolio.json'
      - 'state/model_health.json'
      - 'state/control_epoch.json'
      - 'state/blockers/**'
      - '.github/workflows/factory-supervisor.yml'
      - '.github/workflows/core-lane.yml'
      - '.github/workflows/frontier-team.yml'
      - '.github/workflows/factory-director.yml'
      - '.github/workflows/factory-housekeeper.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: lex-factory-supervisor
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Keep useful factory capacity alive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          CONTROL_EPOCH=$(jq -r '.started_at // "1970-01-01T00:00:00Z"' state/control_epoch.json 2>/dev/null || echo '1970-01-01T00:00:00Z')
          echo "Control epoch starts at $CONTROL_EPOCH"

          active_count() {
            local workflow="$1" prefix="${2:-}"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 100 --json displayTitle,status \
              | jq --arg p "$prefix" '[.[] | select(($p=="") or (.displayTitle|startswith($p))) | select(.status=="queued" or .status=="in_progress" or .status=="requested" or .status=="waiting" or .status=="pending")] | length'
          }

          consecutive_failures() {
            local workflow="$1" prefix="$2"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 100 --json displayTitle,status,conclusion,createdAt \
              | jq --arg p "$prefix" --arg epoch "$CONTROL_EPOCH" '[.[] | select(.createdAt >= $epoch) | select(.displayTitle|startswith($p)) | select(.status=="completed")] | reduce .[] as $r ({n:0,stop:false}; if .stop then . elif ($r.conclusion=="success") then .stop=true else .n += 1 end) | .n'
          }

          ensure_model_health() {
            if [[ "$(active_count model-health.yml)" -eq 0 ]]; then
              gh workflow run model-health.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "Model health probe dispatched."
            else
              echo "Model health probe already active."
            fi
          }

          ensure_director() {
            if [[ "$(active_count factory-director.yml)" -eq 0 ]]; then
              gh workflow run factory-director.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo "Factory Director dispatched."
            else
              echo "Factory Director already active."
            fi
          }

          if [[ "$(jq -r '.healthy // false' state/model_health.json 2>/dev/null || echo false)" != true ]]; then
            echo "::warning::No healthy free tool-capable model. Recovery probe will keep running."
            ensure_model_health
            exit 0
          fi
          echo "Factory model: $(jq -r '.resolved_model' state/model_health.json) (fallback=$(jq -r '.using_fallback' state/model_health.json))"

          NEED_DIRECTOR=0
          NEED_HEALTH=0
          DIRV=$(jq -r '.version' state/factory_direction.json)

          CORE_RUN_DESIRED=$(jq '[.lanes[] | select(.status=="RUN")] | length' state/factory_direction.json)
          CORE_HUMAN=$(jq '[.lanes[] | select(.status=="HUMAN_DECISION_REQUIRED")] | length' state/factory_direction.json)
          FRONTIER_RUN_DESIRED=$(jq '[.teams[] | select(.status=="RUN")] | length' state/frontier_portfolio.json)
          FRONTIER_HUMAN=$(jq '[.teams[] | select(.status=="HUMAN_DECISION_REQUIRED")] | length' state/frontier_portfolio.json)

          case "$TRIGGER_WORKFLOW" in
            "LEX Core Lane"|"LEX Frontier Team") NEED_DIRECTOR=1 ;;
          esac

          for lane in corpus legal-distance fractal-map evaluation product; do
            status=$(jq -r --arg lane "$lane" '.lanes[$lane].status // "PAUSE"' state/factory_direction.json)
            if [[ "$status" == "HUMAN_DECISION_REQUIRED" ]]; then
              echo "::warning::$lane explicitly requires human decision; this lane alone is paused."
              continue
            fi
            [[ "$status" == RUN ]] || { echo "$lane: $status"; continue; }

            q=$(jq -r --arg lane "$lane" '.lanes[$lane].question // ""' state/factory_direction.json)
            qhash=$(printf '%s' "$q" | sha256sum | awk '{print $1}')
            blocker="state/blockers/$lane.json"
            if [[ -f "$blocker" ]] && [[ "$(jq -r '.question_hash // ""' "$blocker")" == "$qhash" ]]; then
              if [[ "$(jq -r '.requires_human // false' "$blocker")" == true ]]; then
                echo "::warning::$lane has HUMAN_DECISION_REQUIRED blocker; lane paused pending user decision."
              else
                echo "$lane: current question is scientifically/structurally blocked; Director must redirect it."
                NEED_DIRECTOR=1
              fi
              continue
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/lab/$lane" >/dev/null 2>&1; then
              raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/${lane}.json?ref=lab/${lane}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
              if [[ -n "$raw" ]] && [[ "$(jq -r '.continue_recommended // true' <<<"$raw")" == false ]] && [[ "$(jq -r '.direction_version // -1' <<<"$raw")" == "$DIRV" ]]; then
                echo "$lane: same-direction work exhausted; asking Director for a new move."
                NEED_DIRECTOR=1
                continue
              fi
            fi

            prefix="Core ${lane} dirV${DIRV} "
            [[ "$(active_count core-lane.yml "$prefix")" -eq 0 ]] || { echo "$lane: already active/queued"; continue; }

            fails=$(consecutive_failures core-lane.yml "$prefix")
            if (( fails >= 2 )); then
              echo "::warning::$lane has $fails consecutive post-epoch operational workflow failures; retrying instead of blocking."
              NEED_HEALTH=1
              NEED_DIRECTOR=1
            fi

            gh workflow run core-lane.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f lane="$lane" -f direction_version="$DIRV" -f repair_round=0
            echo "$lane: dispatched direction v$DIRV"
          done

          jq -c '.teams[] | select(.status=="RUN")' state/frontier_portfolio.json | while IFS= read -r item; do
            team=$(jq -r .team_id <<<"$item"); ver=$(jq -r .charter_version <<<"$item")
            [[ "$team" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || continue
            blocker="state/blockers/frontier/$team.json"
            if [[ -f "$blocker" ]] && [[ "$(jq -r '.charter_version // -1' "$blocker")" == "$ver" ]]; then
              if [[ "$(jq -r '.requires_human // false' "$blocker")" == true ]]; then
                echo "::warning::Frontier $team v$ver requires human decision; this team alone is paused."
              else
                echo "Frontier $team v$ver blocked under current charter; Director must redirect/kill/recharter it."
              fi
              echo NEED_DIRECTOR > /tmp/lex_need_director_frontier
              continue
            fi

            if git ls-remote --exit-code --heads origin "refs/heads/lab/frontier/$team" >/dev/null 2>&1; then
              raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/frontier/${team}.json?ref=lab/frontier/${team}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
              if [[ -n "$raw" ]] && [[ "$(jq -r '.charter_version // -1' <<<"$raw")" == "$ver" ]] && [[ "$(jq -r '.continue_recommended // true' <<<"$raw")" == false ]]; then
                echo "Frontier $team v$ver exhausted same-charter work; awaiting Director."
                echo NEED_DIRECTOR > /tmp/lex_need_director_frontier
                continue
              fi
            fi

            prefix="Frontier ${team} v${ver} "
            [[ "$(active_count frontier-team.yml "$prefix")" -eq 0 ]] || { echo "Frontier $team already active"; continue; }
            fails=$(consecutive_failures frontier-team.yml "$prefix")
            if (( fails >= 2 )); then
              echo "::warning::Frontier $team has $fails consecutive post-epoch operational failures; retrying, not blocking."
              echo NEED_HEALTH > /tmp/lex_need_health_frontier
              echo NEED_DIRECTOR > /tmp/lex_need_director_frontier
            fi
            gh workflow run frontier-team.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f team_id="$team" -f charter_version="$ver" -f repair_round=0
            echo "Frontier $team v$ver dispatched"
          done

          [[ -f /tmp/lex_need_director_frontier ]] && NEED_DIRECTOR=1
          [[ -f /tmp/lex_need_health_frontier ]] && NEED_HEALTH=1

          if (( CORE_RUN_DESIRED + FRONTIER_RUN_DESIRED == 0 && CORE_HUMAN + FRONTIER_HUMAN == 0 )); then
            echo "::warning::No RUN work and no human-decision gate: Director must create the next productive move."
            NEED_DIRECTOR=1
          fi

          (( NEED_HEALTH == 0 )) || ensure_model_health
          (( NEED_DIRECTOR == 0 )) || ensure_director

          echo "Supervisor pass complete: pre-epoch failures ignored; operational failures retry automatically; only explicit HUMAN_DECISION_REQUIRED state can justify idleness."
