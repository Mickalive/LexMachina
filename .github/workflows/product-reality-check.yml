name: Product Reality Check

on:
  push:
    branches:
      - lab/product

permissions:
  contents: read

jobs:
  reality-check:
    if: contains(github.event.head_commit.message, '[reality-check]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: rent-default
            question: "Sous quelles conditions un bailleur peut-il résilier un bail d'habitation pour retard dans le paiement du loyer selon le droit suisse, et quelles exceptions ou limites jurisprudentielles existent ?"
          - slug: petty-theft-dismissal
            question: "Un vol de faible valeur commis par un employé justifie-t-il un licenciement immédiat selon l'art. 337 CO ? Quelles circonstances font varier la réponse ?"
          - slug: corporate-criminal-liability
            question: "La responsabilité pénale de l'entreprise selon l'art. 102 CP est-elle subsidiaire ou primaire, et pour quelles infractions ? Quelles exigences d'organisation doivent être prouvées ?"
          - slug: business-judgment-rule
            question: "Dans quelles conditions le juge suisse s'abstient-il de revoir une décision commerciale d'un conseil d'administration au titre de la business judgment rule, et quelles exceptions ou limites ressortent de la jurisprudence ?"

    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/requirements-query.txt
      - name: Install dependencies
        run: pip install -r product/requirements-query.txt
      - name: Install current OpenCode
        shell: bash
        run: curl --retry 5 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash
      - name: Run real product question
        timeout-minutes: 10
        env:
          LEX_REPO_ROOT: ${{ github.workspace }}
          REALITY_QUESTION: ${{ matrix.question }}
          REALITY_SLUG: ${{ matrix.slug }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import unicodedata

          sys.path.insert(0, "product")
          sys.path.insert(0, ".")

          from query import enrich_query_bundle, run_query_initial
          from query.bundle import validate_bundle
          from generative_audit import paths

          paths.DEFAULT_FREE_MODELS[:] = [
              "opencode/nemotron-3-ultra-free",
              "opencode/nemotron-3.5-lightning-free",
              "opencode/space-bunny-free",
              "opencode/mimo-v2.6-flash-free",
          ]

          q = os.environ["REALITY_QUESTION"]
          slug = os.environ["REALITY_SLUG"]

          t0 = time.time()
          initial = run_query_initial(q, top_n=100, retrieval_mode="live")
          map_seconds = round(time.time() - t0, 3)

          final = enrich_query_bundle(
              initial,
              retrieval_mode="live",
              evidence_count=10,
              max_cites=8,
              fixture_generation=False,
          )
          total_seconds = round(time.time() - t0, 3)

          errors = validate_bundle(final)
          answer = final.get("answer", {})
          ga = final.get("provenance", {}).get("generative_audit", {})
          adv = ga.get("adversarial") or {}
          cited = set(answer.get("cited_decision_ids") or [])

          def compact_decision(d):
              return {
                  "decision_id": d.get("decision_id"),
                  "rank": d.get("rank"),
                  "citation": d.get("citation"),
                  "court": d.get("court"),
                  "language": d.get("language"),
                  "title": d.get("title"),
                  "cluster_id": d.get("cluster_id"),
                  "counter_status": d.get("counter_status"),
                  "counter_evidence": str(d.get("counter_evidence") or "")[:600],
                  "snippet": str(d.get("snippet") or "")[:900],
                  "canonical_url": d.get("canonical_url"),
              }

          cited_rows = [compact_decision(d) for d in final["decisions"] if d.get("decision_id") in cited]
          counter_rows = [
              compact_decision(d)
              for d in final["decisions"]
              if d.get("counter_status") in {"candidate-limiting", "candidate-contrary", "limiting", "contrary_or_exception"}
          ]
          counter_rows.sort(key=lambda d: (d.get("rank") or 999999))

          cluster_rows = []
          for c in final.get("clusters", []):
              cluster_rows.append({
                  "cluster_id": c.get("cluster_id"),
                  "label": c.get("label"),
                  "size": c.get("size"),
                  "keywords": c.get("keywords"),
              })

          report = {
              "slug": slug,
              "question": q,
              "map_seconds": map_seconds,
              "total_seconds": total_seconds,
              "decision_count": len(final.get("decisions") or []),
              "cluster_count": len(final.get("clusters") or []),
              "clusters": cluster_rows,
              "answer_status": answer.get("status"),
              "answer_method": answer.get("method"),
              "answer_model": answer.get("model"),
              "answer_prose": answer.get("prose"),
              "cited_decision_ids": answer.get("cited_decision_ids") or [],
              "cited_decisions": cited_rows,
              "counter_count": len(counter_rows),
              "counter_decisions": counter_rows[:12],
              "provider_error": ga.get("provider_error"),
              "adversarial_method": adv.get("method"),
              "adversarial_model": adv.get("model"),
              "adversarial_error": adv.get("error"),
              "adversarial_attempts": adv.get("attempts"),
              "hydration": final.get("provenance", {}).get("evidence_hydration"),
              "validation_errors": errors,
          }

          print("LEX_REALITY_CHECK_BEGIN", flush=True)
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True), flush=True)
          print("LEX_REALITY_CHECK_END", flush=True)

          assert errors == [], errors
          assert answer.get("status") == "ready", report
          assert answer.get("method") == "generative_audit_llm_v2", report
          assert len(str(answer.get("prose") or "")) >= 120, report
          assert answer.get("cited_decision_ids"), report
          ids = {d["decision_id"] for d in final["decisions"]}
          assert set(answer.get("cited_decision_ids") or []) <= ids, report
          assert ga.get("provider_error") in (None, ""), report
          assert adv.get("method") == "independent_llm_adversarial_v2", report
          assert adv.get("error") in (None, ""), report

          # Product truth gates: structural green is not enough. These encode
          # independently known legal propositions/authorities for the four
          # frozen smoke questions so a fluent but materially wrong answer fails.
          def norm(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              return " ".join(value.casefold().split())

          prose = norm(answer.get("prose"))
          cited_ids = set(answer.get("cited_decision_ids") or [])

          if slug == "rent-default":
              assert "30" in prose, report
              assert (
                  "fin d'un mois" in prose
                  or "fin d’un mois" in prose
                  or "fin de mois" in prose
                  or "fin du mois" in prose
                  or "ende eines monats" in prose
              ), "missing Art. 257d(2) residential termination notice period"
              assert (
                  "abus" in prose or "bonne foi" in prose or "rechtsmissbrauch" in prose
              ), "missing jurisprudential limitation / good-faith branch"

          elif slug == "corporate-criminal-liability":
              assert "subsidi" in prose, "missing Art. 102(1) subsidiary branch"
              assert (
                  "responsabilite primaire" in prose or "originar" in prose
              ), "missing Art. 102(2) primary/original liability"
              assert "ne cree pas une responsabilite primaire" not in prose, (
                  "answer reverses the Federal Supreme Court's Art. 102(2) classification"
              )
              assert cited_ids & {"bge_BGE_142_IV_333", "bger_6B_124_2016"}, (
                  "answer must use direct Federal Supreme Court Art. 102(2) authority"
              )

          elif slug == "business-judgment-rule":
              assert "information" in prose, "missing adequate-information criterion"
              assert (
                  "conflit" in prose or "interessenkonflikt" in prose
              ), "missing conflict-of-interest criterion"
              assert (
                  "retenue" in prose or "zuruckhaltung" in prose or "deference" in prose
                  or "abstient" in prose or "abstenir" in prose
              ), "missing judicial-restraint proposition"
              assert cited_ids & {
                  "bger_4A_219_2015", "bger_4A_259_2016", "bger_4A_626_2013",
                  "bger_4A_603_2014", "bger_4A_62_2024",
              }, "answer must cite direct Federal Supreme Court BJR authority"

          elif slug == "petty-theft-dismissal":
              direct = {"bger_4A_228_2015", "bger_4A_177_2017"}
              assert ids & direct, "retrieval missed direct Federal Supreme Court petty-theft authority"
              assert cited_ids & direct, "answer ignored direct Federal Supreme Court petty-theft authority"
              assert (
                  "faible valeur" in prose or "geringfug" in prose or "bagatell" in prose
              ), "answer does not address the low-value fact pattern"
          PY
