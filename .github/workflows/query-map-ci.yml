name: Query Map CI

on:
  push:
    branches:
      - lab/product
      - fix/v45-product-convergence
  pull_request:
    branches:
      - lab/product
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v45-query-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: product/requirements-query.txt
      - name: Install query-map dependencies
        run: pip install -r product/requirements-query.txt
      - name: Compile v45 product seam
        run: |
          python -m py_compile \
            product/query/pipeline.py \
            product/query/qmap.py \
            product/query/corpus.py \
            product/query_app.py
      - name: Product integration tests
        run: pytest -q product/tests/test_query_map_mvp.py
      - name: Accepted retrieval adapter tests
        run: python -m unittest discover -s tests/frontier/frontier-query-retrieval -p 'test_*.py'
      - name: Accepted generative-audit tests
        run: pytest -q tests/frontier/frontier-generative-audit/test_generative_audit_v2.py
